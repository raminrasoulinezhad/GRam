<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!--
      viewport-fit=cover lets the app paint under the notch and home indicator; the safe-area
      insets are handled by react-native-safe-area-context. Without it an installed app sits in
      a letterbox with white bars.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, shrink-to-fit=no"
    />
    <title>GRam</title>
    <meta name="description" content="Plan your sets and see which muscles you have actually trained." />

    <link rel="manifest" href="/manifest.json" />
    <!--
      These three - and background-color below, and the two colours in manifest.json - are the
      DEFAULT theme, Midnight. They are what the page shows in the moment before the bundle runs
      and on the install splash screen, which is the one paint no JavaScript can reach.

      src/ui/theme.ts overwrites them at import with whichever palette the user actually chose,
      so someone on Chalk gets a white frame. Keep them matching DEFAULT_THEME in src/ui/themes.ts:
      when they drifted - they said navy while the default was briefly Carbon black - the app
      opened with a flash of the wrong colour and installed with a mismatched splash.
    -->
    <meta name="theme-color" content="#0B1220" />
    <meta name="color-scheme" content="dark" />

    <!--
      iOS ignores most of the web app manifest. These four tags are what actually make an
      "Add to Home Screen" install open fullscreen with the right icon and status bar, instead
      of as a Safari tab.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GRam" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="icon" href="/icons/icon-192.png" type="image/png" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #0b1220;
      }
      body {
        /*
         * Pinned to the *visual* viewport, not the layout viewport.
         *
         * When the iOS keyboard opens it shrinks the visual viewport but leaves the layout
         * viewport at full height, so a 100%-tall app suddenly overflows and the whole page
         * becomes scrollable - tap the search box and the header, the filter chips and the tab
         * bar all start sliding around. Only the results list should ever scroll.
         *
         * --vvh is set by src/ui/useViewportHeight.ts, and ONLY while a keyboard is actually
         * covering part of the screen. The rest of the time it is unset and the 100dvh below
         * applies, so the app paints the full screen - under the status bar and the home
         * indicator - which is what viewport-fit=cover and black-translucent are for.
         */
        height: 100vh;
        height: 100dvh;
        height: var(--vvh, 100dvh);
        overflow: hidden;
        /* Stop iOS bouncing the whole page and offering to select UI text as if it were content. */
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        /* Belt and braces: nothing above the app's own scrollers may scroll. */
        overflow: hidden;
      }
      /* Text inputs must stay selectable, or editing a weight becomes miserable. */
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!--
      The feedback form, declared here and never shown.

      Netlify discovers forms by parsing the DEPLOYED HTML at build time, so a form that only
      ever exists as React components is a form it has never heard of and every submission comes
      back 404. This is the declaration: the field names here are the contract, and they must
      match the body built in src/lib/feedback.ts.

      The destination address is NOT here, and that is the whole reason this approach was
      chosen. It lives in the Netlify dashboard under Forms > Form notifications, which is
      server-side configuration - so it is in neither this repository nor the JavaScript bundle
      that every visitor downloads. See src/lib/feedback.ts for why no amount of encoding would
      have made an embedded address private.

      `netlify-honeypot` names a field humans leave empty and bots fill in; submissions with
      anything in it are dropped silently rather than bounced, which is what stops a public
      endpoint from becoming a spam funnel.
    -->
    <form name="gram-feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <textarea name="message"></textarea>
      <input type="text" name="version" />
    </form>
    <script>
      // Registered after load so it never competes with the first paint. Only meaningful over
      // HTTPS (or localhost); on plain HTTP the browser declines and the app still works online.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {
            /* Offline support is an enhancement, not a requirement. */
          });
        });
      }
    </script>
  </body>
</html>
